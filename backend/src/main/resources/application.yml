spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/pdv2cloud}
    username: ${DATABASE_USER:pdv2cloud}
    password: ${DATABASE_PASSWORD:pdv2cloud}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        type:
          preferred_uuid_jdbc_type: UUID
  flyway:
    enabled: true
    locations: classpath:db/migration
    # Migrations rodam com a role dona do schema; a aplicacao conecta com role sujeita a RLS.
    # url explicito e obrigatorio no Spring Boot 3.2 quando user/password diferem do datasource,
    # senao o Flyway tenta montar um DataSource sem URL e o boot falha.
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/pdv2cloud}
    user: ${FLYWAY_USER:${DATABASE_USER:pdv2cloud}}
    password: ${FLYWAY_PASSWORD:${DATABASE_PASSWORD:pdv2cloud}}
  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8080
  forward-headers-strategy: framework
  servlet:
    encoding:
      enabled: true
      force: true
      charset: UTF-8

# JWT_SECRET nao tem fallback: a aplicacao falha no startup se nao for configurado (ver .env.example)
jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION_MS:86400000}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

auth:
  cookie:
    same-site: ${AUTH_COOKIE_SAMESITE:None}

jobs:
  enabled: ${JOBS_ENABLED:false}

app:
  downloads:
    installer-dir: ${INSTALLER_DIR:/opt/pdv2cloud/installer}
  public-base-url: ${APP_PUBLIC_BASE_URL:https://mercadoflow.com}
  catalog:
    images-dir: ${APP_CATALOG_IMAGES_DIR:../data/catalog/images}
    max-image-bytes: ${APP_CATALOG_MAX_IMAGE_BYTES:5000000}
    runs-dir: ${APP_CATALOG_RUNS_DIR:../data/catalog/runs}
    image-repair:
      enabled: ${CATALOG_IMAGE_REPAIR_ENABLED:false}
      initial-delay-ms: ${CATALOG_IMAGE_REPAIR_INITIAL_DELAY_MS:900000}
      fixed-delay-ms: ${CATALOG_IMAGE_REPAIR_FIXED_DELAY_MS:21600000}
      batch-size: ${CATALOG_IMAGE_REPAIR_BATCH_SIZE:200}
      max-items-per-run: ${CATALOG_IMAGE_REPAIR_MAX_ITEMS_PER_RUN:1000}
      provider: ${CATALOG_IMAGE_REPAIR_PROVIDER:}
    web-import:
      enabled: ${CATALOG_WEB_IMPORT_ENABLED:false}
      initial-delay-ms: ${CATALOG_WEB_IMPORT_INITIAL_DELAY_MS:180000}
      fixed-delay-ms: ${CATALOG_WEB_IMPORT_FIXED_DELAY_MS:86400000}
      max-pages-per-source: ${CATALOG_WEB_IMPORT_MAX_PAGES:5}
      page-size: ${CATALOG_WEB_IMPORT_PAGE_SIZE:100}
      include-beauty-facts: ${CATALOG_WEB_IMPORT_INCLUDE_BEAUTY:true}
      include-open-products-facts: ${CATALOG_WEB_IMPORT_INCLUDE_OPEN_PRODUCTS:true}
  price-intelligence:
    fixed-delay-ms: ${PRICE_INTELLIGENCE_FIXED_DELAY_MS:900000}
  offers:
    outputs-dir: ${APP_OFFERS_OUTPUTS_DIR:../data/offers}

logging:
  level:
    root: INFO
    com.pdv2cloud: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info
