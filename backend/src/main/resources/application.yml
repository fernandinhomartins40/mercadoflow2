spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/pdv2cloud}
    username: ${DATABASE_USER:pdv2cloud}
    password: ${DATABASE_PASSWORD:pdv2cloud}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        type:
          preferred_uuid_jdbc_type: UUID
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8080
  forward-headers-strategy: framework
  servlet:
    encoding:
      enabled: true
      force: true
      charset: UTF-8

jwt:
  secret: ${JWT_SECRET:CWkVPciXTxXTcBAh8BXGQYqcyX3Ci6ekGsnfr14YiQz+N6xsAfFIYi/IEhBTx7uyAM/su+p7994Mk4Qex0Ht1Q==}
  expiration: ${JWT_EXPIRATION_MS:86400000}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

auth:
  cookie:
    same-site: ${AUTH_COOKIE_SAMESITE:None}

jobs:
  enabled: ${JOBS_ENABLED:false}

app:
  downloads:
    installer-dir: ${INSTALLER_DIR:/opt/pdv2cloud/installer}
  public-base-url: ${APP_PUBLIC_BASE_URL:https://mercadoflow.com}
  catalog:
    images-dir: ${APP_CATALOG_IMAGES_DIR:../data/catalog/images}
    web-import:
      enabled: ${CATALOG_WEB_IMPORT_ENABLED:false}
      initial-delay-ms: ${CATALOG_WEB_IMPORT_INITIAL_DELAY_MS:180000}
      fixed-delay-ms: ${CATALOG_WEB_IMPORT_FIXED_DELAY_MS:86400000}
      max-pages-per-source: ${CATALOG_WEB_IMPORT_MAX_PAGES:5}
      page-size: ${CATALOG_WEB_IMPORT_PAGE_SIZE:100}
      include-beauty-facts: ${CATALOG_WEB_IMPORT_INCLUDE_BEAUTY:true}
      include-open-products-facts: ${CATALOG_WEB_IMPORT_INCLUDE_OPEN_PRODUCTS:true}
  price-intelligence:
    fixed-delay-ms: ${PRICE_INTELLIGENCE_FIXED_DELAY_MS:900000}

logging:
  level:
    root: INFO
    com.pdv2cloud: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info
