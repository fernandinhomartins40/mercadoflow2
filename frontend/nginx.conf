server {
    listen 3000;
    server_name _;
    charset utf-8;
    charset_types text/html text/css application/javascript application/json image/svg+xml;
    add_header Content-Language pt-BR always;

    root /usr/share/nginx/html;
    index index.html;

    # Os .gz sao gerados no build da imagem (ver Dockerfile): servir o arquivo
    # pronto custa zero CPU por requisicao. O gzip dinamico cobre so o que nao
    # foi pre-comprimido.
    gzip_static on;
    gzip on;
    gzip_proxied any;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # O Vite coloca o hash do conteudo no nome de tudo em /assets/: um arquivo
    # com o mesmo nome nunca muda, entao o navegador pode guarda-lo por um ano
    # sem revalidar. Sem isso cada navegacao revalidava todos os chunks.
    # add_header dentro de location anula o do server, por isso o repetimos.
    location /assets/ {
        add_header Content-Language pt-BR always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # index.html aponta para os chunks do release atual: precisa ser revalidado
    # sempre, ou o navegador continua pedindo chunks de um deploy anterior.
    location = /index.html {
        add_header Content-Language pt-BR always;
        add_header Cache-Control "no-cache" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
