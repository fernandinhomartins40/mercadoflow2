<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Bipaê sem internet</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #045e48; color: #fff;
      font: 17px/1.5 -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center; padding: 24px; box-sizing: border-box; }
    img { width: 96px; height: 96px; }
    h1 { font-size: 24px; margin: 20px 0 8px; }
    p { margin: 0 auto 24px; max-width: 30ch; color: #d6efe6; }
    button { border: 0; border-radius: 14px; background: #fcbf27; color: #1f2a00; font: inherit; font-weight: 700; padding: 14px 28px; }
  </style>
</head>
<body>
  <main>
    <img src="bipae/icon.svg" alt="">
    <h1>Sem internet agora</h1>
    <p>O Bipaê precisa de internet para abrir. Confira o Wi-Fi ou os dados do celular e tente de novo.</p>
    <button type="button" onclick="location.href='https://mercadoflow.com/confere/'">Tentar de novo</button>
  </main>
</body>
</html>
