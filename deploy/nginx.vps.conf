upstream backend_upstream {
    server mercadoflow-backend:8080;
    # Reaproveita conexoes com o Tomcat em vez de abrir um TCP por requisicao.
    # 15s fica abaixo do keep-alive do Tomcat, para o nginx nunca reutilizar
    # uma conexao que o backend ja fechou.
    keepalive 16;
    keepalive_timeout 15s;
}

upstream frontend_upstream {
    server mercadoflow-frontend:3000;
    keepalive 8;
    keepalive_timeout 15s;
}

server {
    listen 3300;
    server_name _;

    client_max_body_size 50M;

    # IP real do cliente. A conexao chega do proxy do host pela rede Docker, e
    # ele envia o endereco do visitante em X-Real-IP. So aceitamos esse
    # cabecalho de redes privadas/loopback; dai em diante $remote_addr e o IP do
    # visitante, repassado ao backend (rate limit de login e pareamento).
    set_real_ip_from 127.0.0.1;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Real-IP;

    # O backend responde JSON sem compressao. Os estaticos do frontend ja chegam
    # pre-comprimidos (gzip_static no container do frontend) e o nginx nao
    # recomprime respostas que ja trazem Content-Encoding. Nivel 4: quase toda a
    # reducao de bytes do nivel 9 com uma fracao da CPU.
    gzip on;
    gzip_proxied any;
    gzip_vary on;
    gzip_comp_level 4;
    gzip_min_length 1024;
    gzip_types application/json application/problem+json text/plain text/csv text/css application/javascript image/svg+xml;

    location /api/ {
        proxy_pass http://backend_upstream/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        # Necessario para o keepalive do upstream: sem isto o nginx envia
        # "Connection: close" e cada requisicao abre uma conexao nova.
        proxy_set_header Connection "";
    }

    # O gate de deploy consulta esta rota no proxy exposto. Sem uma location
    # própria, o fallback do frontend responde 200 com index.html e mascara a
    # indisponibilidade da API.
    location = /health {
        proxy_pass http://backend_upstream/health;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    location / {
        proxy_pass http://frontend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }
}
