version: '3.8'

# Segredos vem do arquivo .env (nao versionado) — ver .env.example.
# A sintaxe ${VAR:?...} faz o compose falhar rapido se a variavel nao estiver definida.

services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      - api

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=pdv2cloud
      - POSTGRES_USER=pdv2cloud
      - POSTGRES_PASSWORD=${DATABASE_ADMIN_PASSWORD:?Defina DATABASE_ADMIN_PASSWORD no .env}
      - DATABASE_APP_USER=${DATABASE_APP_USER:-pdv2cloud_app}
      - DATABASE_APP_PASSWORD=${DATABASE_APP_PASSWORD:?Defina DATABASE_APP_PASSWORD no .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Cria a role de aplicacao (sem BYPASSRLS) no primeiro provisionamento
      - ./scripts/db/setup-tenant-roles.sh:/docker-entrypoint-initdb.d/10-setup-tenant-roles.sh:ro

  api:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=production
      - DATABASE_URL=jdbc:postgresql://postgres:5432/pdv2cloud
      # Role de aplicacao SEM BYPASSRLS (sujeita a Row-Level Security)
      - DATABASE_USER=${DATABASE_APP_USER:-pdv2cloud_app}
      - DATABASE_PASSWORD=${DATABASE_APP_PASSWORD:?Defina DATABASE_APP_PASSWORD no .env}
      # Flyway roda migrations com a role dona do schema
      - FLYWAY_USER=pdv2cloud
      - FLYWAY_PASSWORD=${DATABASE_ADMIN_PASSWORD:?Defina DATABASE_ADMIN_PASSWORD no .env}
      - JWT_SECRET=${JWT_SECRET:?Defina JWT_SECRET no .env}
      - JWT_EXPIRATION_MS=86400000
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - APP_SUPER_ADMIN_PASSWORD=${SUPER_ADMIN_PASSWORD:-}
      - CORS_ALLOWED_ORIGINS=https://app.pdv2cloud.com
      - INSTALLER_DIR=/opt/pdv2cloud/installer
      - APP_PUBLIC_BASE_URL=https://mercadoflow.com
      - APP_CATALOG_IMAGES_DIR=/opt/pdv2cloud/catalog-data/images
    depends_on:
      - postgres
    volumes:
      - ./pdv2cloud-agent/installer/Output:/opt/pdv2cloud/installer:ro
      - ./data/catalog:/opt/pdv2cloud/catalog-data

  cron-jobs:
    build: ./backend
    command: java -jar /app/app.jar --spring.profiles.active=jobs
    environment:
      - SPRING_PROFILES_ACTIVE=jobs
      - DATABASE_URL=jdbc:postgresql://postgres:5432/pdv2cloud
      # Jobs operam sobre todos os tenants: usam a role dona do schema (bypassa RLS)
      - DATABASE_USER=pdv2cloud
      - DATABASE_PASSWORD=${DATABASE_ADMIN_PASSWORD:?Defina DATABASE_ADMIN_PASSWORD no .env}
      - JWT_SECRET=${JWT_SECRET:?Defina JWT_SECRET no .env}
      - JWT_EXPIRATION_MS=86400000
    depends_on:
      - api

volumes:
  postgres-data:
