services:
  mercadoflow-postgres:
    container_name: mercadoflow-postgres
    # Digest observado na VPS linux/amd64 em 2026-09-25. A tag é mantida para
    # legibilidade, mas o pull e o rollback passam a ser imutáveis.
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    restart: unless-stopped
    logging: &mercadoflow_logging
      driver: local
      options:
        max-size: "20m"
        max-file: "3"
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - DATABASE_APP_USER=${DATABASE_APP_USER:-pdv2cloud_app}
      - DATABASE_APP_PASSWORD=${DATABASE_APP_PASSWORD:-}
    volumes:
      - mercadoflow_postgres_data:/var/lib/postgresql/data
      # Cria a role de aplicacao (sem BYPASSRLS) no primeiro provisionamento.
      # Para volume ja existente, rode o script manualmente (ver scripts/db/setup-tenant-roles.sh)
      - ./scripts/db/setup-tenant-roles.sh:/docker-entrypoint-initdb.d/10-setup-tenant-roles.sh:ro
    # effective_cache_size default e calculado sobre a RAM TOTAL da VPS (5 GB),
    # mas esta maquina hospeda outras 5 aplicacoes e mais 4 instancias
    # PostgreSQL. Prometer 5 GB de cache ao planejador o faz escolher planos que
    # assumem dados em memoria que nao existe.
    command: >
      postgres
      -c effective_cache_size=768MB
      -c shared_buffers=192MB
      -c max_connections=50
    mem_limit: 640m
    memswap_limit: 640m
    # Sem teto de CPU (consultas do usuario competem com o boot do backend), mas
    # com peso cheio: sob disputa ele e servido antes dos jobs e coletores.
    cpu_shares: 1024
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mercadoflow-backend:
    container_name: mercadoflow-backend
    image: ${MERCADOFLOW_BACKEND_IMAGE:?MERCADOFLOW_BACKEND_IMAGE is required}
    # Sem isto o container ficava com RestartPolicy "no": uma queda derrubava a
    # aplicacao ate o proximo deploy. Passa a importar mais agora que ha
    # mem_limit -- um OOM deve reiniciar, nao deixar o servico fora do ar.
    restart: unless-stopped
    logging: *mercadoflow_logging
    environment:
      - SPRING_PROFILES_ACTIVE=production
      # Sem mem_limit a JVM enxergava os 8 GB da VPS e reservava 25% (~2 GB) de
      # heap. Com o limite abaixo, MaxRAMPercentage passa a ser calculado sobre
      # 1 GB. A margem de 40% cobre metaspace, threads e buffers off-heap, que
      # NAO entram no heap mas contam no limite do container.
      # G1 (nao SerialGC): este processo atende requisicoes e uma pausa longa
      # de coletor aparece como lentidao para o usuario. O ganho de RAM do
      # SerialGC fica para o container de jobs, onde latencia nao importa.
      - JAVA_TOOL_OPTIONS=-XX:MaxRAMPercentage=60.0 -XX:MaxMetaspaceSize=192m -XX:+ExitOnOutOfMemoryError
      - DATABASE_URL=${DATABASE_URL}
      # DATABASE_USER deve ser a role de aplicacao (pdv2cloud_app), sujeita a RLS
      - DATABASE_USER=${DATABASE_USER}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD}
      # Flyway roda migrations com a role dona do schema
      - FLYWAY_USER=${FLYWAY_USER:-${POSTGRES_USER}}
      - FLYWAY_PASSWORD=${FLYWAY_PASSWORD:-${POSTGRES_PASSWORD}}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRATION_MS=86400000
      - CORS_ALLOWED_ORIGINS=${CORS_ORIGIN}
      - INSTALLER_DIR=/opt/pdv2cloud/installer
      - APP_PUBLIC_BASE_URL=https://mercadoflow.com
      - APP_CATALOG_IMAGES_DIR=/opt/pdv2cloud/catalog-data/images
      - APP_OFFERS_OUTPUTS_DIR=/opt/pdv2cloud/offers-data
      - APP_SUPER_ADMIN_EMAIL=${SUPER_ADMIN_EMAIL}
      - APP_SUPER_ADMIN_PASSWORD=${SUPER_ADMIN_PASSWORD}
      - APP_SUPER_ADMIN_NAME=${SUPER_ADMIN_NAME}
      # Contas de teste (TestUsersSeeder). Vazias = seeder nao cria.
      - TEST_ADMIN_PASSWORD=${TEST_ADMIN_PASSWORD:-}
      - TEST_SUPER_ADMIN_PASSWORD=${TEST_SUPER_ADMIN_PASSWORD:-}
      # Cobranca de assinaturas. Com STRIPE_ENABLED=false (padrao) a aplicacao
      # sobe sem cobranca e o upgrade permanece manual no painel super admin.
      - STRIPE_ENABLED=${STRIPE_ENABLED:-false}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
      - STRIPE_PRICE_ESSENCIAL=${STRIPE_PRICE_ESSENCIAL:-}
      - STRIPE_PRICE_PROFISSIONAL=${STRIPE_PRICE_PROFISSIONAL:-}
      # Cifra as chaves de IA que os clientes cadastram (BYOK). Ausente = BYOK
      # desabilitado com aviso na tela; todo o resto do produto segue igual.
      - AI_ENCRYPTION_KEY=${AI_ENCRYPTION_KEY:-}
      - CATALOG_IMAGE_REPAIR_ENABLED=${CATALOG_IMAGE_REPAIR_ENABLED:-true}
      - CATALOG_IMAGE_REPAIR_INITIAL_DELAY_MS=${CATALOG_IMAGE_REPAIR_INITIAL_DELAY_MS:-60000}
      - CATALOG_IMAGE_REPAIR_FIXED_DELAY_MS=${CATALOG_IMAGE_REPAIR_FIXED_DELAY_MS:-21600000}
      - CATALOG_IMAGE_REPAIR_BATCH_SIZE=${CATALOG_IMAGE_REPAIR_BATCH_SIZE:-300}
      - CATALOG_IMAGE_REPAIR_MAX_ITEMS_PER_RUN=${CATALOG_IMAGE_REPAIR_MAX_ITEMS_PER_RUN:-250000}
      - CATALOG_IMAGE_REPAIR_PROVIDER=${CATALOG_IMAGE_REPAIR_PROVIDER:-}
    depends_on:
      mercadoflow-postgres:
        condition: service_healthy
    volumes:
      - ./pdv2cloud-agent/installer/Output:/opt/pdv2cloud/installer:ro
      - ./data/catalog:/opt/pdv2cloud/catalog-data
      - ./data/offers:/opt/pdv2cloud/offers-data
    mem_limit: 1024m
    memswap_limit: 1024m
    # Sem teto de CPU: o boot com Flyway ja leva minutos nesta VPS e um teto o
    # alongaria. O peso cheio garante prioridade sobre cron e coletores quando
    # ha disputa pelas 2 vCPU; sem disputa, peso nao limita nada.
    cpu_shares: 1024
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health >/dev/null 2>&1 || exit 1"]
      # 30s em vez de 10s: o backend leva semanas no ar sem oscilar, e o
      # healthcheck a cada 10s era 3x mais wget do que o necessario para
      # detectar uma queda em tempo util.
      interval: 30s
      timeout: 5s
      retries: 5
      # 600s, nao 90s. Medido no deploy de 14/09: "Started PDV2CloudApplication
      # in 501.704 seconds". Nesta VPS o boot e lento por dois motivos somados —
      # 50-63% de steal time e o Flyway rodando migracoes no start.
      #
      # Com 90s o healthcheck comecava a falhar aos 90s e, apos 5 retries de 30s,
      # marcava o backend como unhealthy por volta de 240s — muito antes dos
      # 501s reais. Como frontend, cron, nginx e os tres coletores tem
      # "depends_on: mercadoflow-backend / condition: service_healthy", o
      # "compose up" desistia e os deixava em "Created", nunca iniciados.
      # Resultado: o backend acabava saudavel, mas o site ficava em 502 porque o
      # container do frontend jamais subiu. Falha silenciosa — o deploy termina
      # sem erro visivel e so o usuario final percebe.
      #
      # start_period nao atrasa nada quando o boot e rapido: o container e
      # marcado healthy no primeiro wget que responde.
      start_period: 600s

  mercadoflow-frontend:
    container_name: mercadoflow-frontend
    restart: unless-stopped
    logging: *mercadoflow_logging
    image: ${MERCADOFLOW_FRONTEND_IMAGE:?MERCADOFLOW_FRONTEND_IMAGE is required}
    mem_limit: 64m
    memswap_limit: 64m
    depends_on:
      mercadoflow-backend:
        condition: service_healthy

  mercadoflow-cron:
    container_name: mercadoflow-cron
    image: ${MERCADOFLOW_BACKEND_IMAGE:?MERCADOFLOW_BACKEND_IMAGE is required}
    restart: unless-stopped
    logging: *mercadoflow_logging
    command: java -jar /app/app.jar
    environment:
      # production,jobs (nao so "jobs"): sozinho, o perfil jobs perdia o
      # application-production.yml e o processo subia com log verboso e sem as
      # configuracoes de producao. O perfil jobs tambem reduz o Tomcat ao minimo
      # e o pool do banco a 4 conexoes -- este container nunca recebe requisicao.
      - SPRING_PROFILES_ACTIVE=production,jobs
      # Heap menor que o do backend: os jobs rodam em serie e de madrugada.
      # ExitOnOutOfMemoryError: sem ele um OOM de heap deixa a JVM viva e sem
      # agendamentos; saindo, o restart policy sobe um processo limpo.
      - JAVA_TOOL_OPTIONS=-XX:MaxRAMPercentage=60.0 -XX:+UseSerialGC -XX:MaxMetaspaceSize=160m -XX:+ExitOnOutOfMemoryError
      - DATABASE_URL=${DATABASE_URL}
      # Jobs operam sobre todos os tenants: usam a role dona do schema (nao sujeita a RLS)
      - DATABASE_USER=${POSTGRES_USER}
      - DATABASE_PASSWORD=${POSTGRES_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRATION_MS=86400000
      # O container de jobs tambem precisa: e ele quem interpreta as
      # oportunidades no batch noturno, decifrando a chave de cada mercado.
      - AI_ENCRYPTION_KEY=${AI_ENCRYPTION_KEY:-}
    mem_limit: 640m
    memswap_limit: 640m
    # Medido em 2026-09-25: o cron chegou a 195% de CPU numa VPS de 2 vCPU
    # (loop de boot) e a 280-320% durante jobs, disputando CPU com o backend e
    # com as outras aplicacoes do host. Os jobs rodam em serie numa unica thread
    # de agendamento, entao 1 vCPU nao reduz paralelismo util: limita o pico de
    # JIT/GC do boot. Peso 512 cede a vez ao backend/PostgreSQL sob disputa.
    cpus: 1.0
    cpu_shares: 512
    depends_on:
      mercadoflow-backend:
        condition: service_healthy

  mercadoflow-nginx:
    container_name: mercadoflow-nginx
    # Mesmo critério do PostgreSQL: não atualizar a base silenciosamente no
    # próximo deploy; mudanças de base entram como release explícito.
    image: nginx:alpine@sha256:1ed1b0e1d7652937d6cbdaf4018c7b6fc009a7dd6c3047351e2eddda745de43f
    restart: unless-stopped
    logging: *mercadoflow_logging
    ports:
      - "3300:3300"
    volumes:
      - ./deploy/nginx.vps.conf:/etc/nginx/conf.d/default.conf:ro
    mem_limit: 64m
    memswap_limit: 64m
    depends_on:
      mercadoflow-backend:
        condition: service_healthy
      mercadoflow-frontend:
        condition: service_started

  mercadoflow-catalog-harvester:
    container_name: mercadoflow-catalog-harvester
    image: ${MERCADOFLOW_COLLECTORS_IMAGE:?MERCADOFLOW_COLLECTORS_IMAGE is required}
    restart: unless-stopped
    logging: *mercadoflow_logging
    working_dir: /workspace
    command: >
      sh -c "python /workspace/scripts/catalog/market_catalog_dispatcher.py
      --watch
      --interval-minutes ${CATALOG_HARVESTER_INTERVAL_MINUTES:-360}
      --koch-store-id \"${SUPERKOCH_STORE_ID:-}\" 
      --api-base http://mercadoflow-backend:8080/api
      --login-endpoint /v1/super-admin/auth/login
      --config-endpoint /v1/super-admin/catalog/crawler/config
      --email ${SUPER_ADMIN_EMAIL}
      --password ${SUPER_ADMIN_PASSWORD}"
    volumes:
      - ./scripts/catalog:/workspace/scripts/catalog:ro
      - ./data/catalog:/workspace/data/catalog
    mem_limit: 192m
    memswap_limit: 192m
    # Coletor em lote, sem usuario esperando: meia vCPU e peso baixo impedem
    # que um ciclo de coleta dispute CPU com requisicoes interativas.
    cpus: 0.5
    cpu_shares: 256
    depends_on:
      mercadoflow-backend:
        condition: service_healthy

  mercadoflow-barcode-enricher:
    container_name: mercadoflow-barcode-enricher
    image: ${MERCADOFLOW_COLLECTORS_IMAGE:?MERCADOFLOW_COLLECTORS_IMAGE is required}
    restart: unless-stopped
    logging: *mercadoflow_logging
    working_dir: /workspace
    command: >
      python /workspace/scripts/catalog/barcode_enrichment_service.py
      --watch
      --interval-minutes ${BARCODE_ENRICH_INTERVAL_MINUTES:-720}
      --api-base http://mercadoflow-backend:8080/api
      --login-endpoint /v1/super-admin/auth/login
      --email ${SUPER_ADMIN_EMAIL}
      --password ${SUPER_ADMIN_PASSWORD}
      --fetch-catalog-from-api
    volumes:
      - ./scripts/catalog:/workspace/scripts/catalog:ro
      - ./data/catalog:/workspace/data/catalog
    mem_limit: 192m
    memswap_limit: 192m
    # Coletor em lote, sem usuario esperando: meia vCPU e peso baixo impedem
    # que um ciclo de coleta dispute CPU com requisicoes interativas.
    cpus: 0.5
    cpu_shares: 256
    depends_on:
      mercadoflow-backend:
        condition: service_healthy

  mercadoflow-state-price-sync:
    profiles:
      - state-price-sync
    container_name: mercadoflow-state-price-sync
    image: ${MERCADOFLOW_COLLECTORS_IMAGE:?MERCADOFLOW_COLLECTORS_IMAGE is required}
    restart: unless-stopped
    logging: *mercadoflow_logging
    working_dir: /workspace
    command: >
      python /workspace/scripts/state_prices/sync_state_price_portals.py
      --watch
      --import
      --interval-minutes ${STATE_PRICE_SYNC_INTERVAL_MINUTES:-360}
      --max-pages ${STATE_PRICE_SYNC_MAX_PAGES:-4}
      --pause-seconds ${STATE_PRICE_SYNC_PAUSE_SECONDS:-0.5}
      --api-base http://mercadoflow-backend:8080/api
      --login-endpoint /v1/super-admin/auth/login
      --import-endpoint /v1/state-prices/import
      --email ${SUPER_ADMIN_EMAIL}
      --password ${SUPER_ADMIN_PASSWORD}
    volumes:
      - ./scripts/state_prices:/workspace/scripts/state_prices:ro
    # Medido em 121 MB apos 4 semanas no ar -- 4x os outros dois coletores, que
    # rodam o mesmo tipo de loop. O teto evita que o crescimento continue as
    # custas das outras aplicacoes da VPS.
    mem_limit: 320m
    memswap_limit: 320m
    cpus: 0.5
    cpu_shares: 256
    depends_on:
      mercadoflow-backend:
        condition: service_healthy

volumes:
  mercadoflow_postgres_data:
    external: true
    name: ${MERCADOFLOW_POSTGRES_VOLUME:-mercadoflow-web_mercadoflow_postgres_data}
