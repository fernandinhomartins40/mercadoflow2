name: Deploy PDV2Cloud Web to VPS

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'scripts/**'
      - 'docker-compose.vps.yml'
      - 'deploy/**'
      - '.github/workflows/deploy-pdv2cloud-web.yml'
  workflow_dispatch:

concurrency:
  group: deploy-pdv2cloud-web
  cancel-in-progress: true

jobs:
  validate-migrations:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Precisa do histórico para comparar as migrações com o commit
          # anterior; com o checkout raso (padrão) não há com o que comparar.
          fetch-depth: 0

      # Migração já aplicada em produção não pode mudar de conteúdo: o Flyway
      # guarda o checksum e recusa subir quando ele diverge. Editar uma delas
      # deixou o backend fora do ar por 7 horas, e o erro só apareceu no deploy
      # — tarde demais. Aqui a esteira para antes de derrubar nada.
      - name: Verificar migrações já aplicadas
        run: |
          set -euo pipefail
          DIR=backend/src/main/resources/db/migration

          # No primeiro commit do repo não há anterior com que comparar.
          if ! git rev-parse HEAD~1 >/dev/null 2>&1; then
            echo "Sem commit anterior; nada a verificar."
            exit 0
          fi

          alteradas=$(git diff --name-only --diff-filter=MD HEAD~1 HEAD -- "$DIR" || true)

          if [ -z "$alteradas" ]; then
            echo "Nenhuma migração existente foi alterada."
            exit 0
          fi

          # Válvula de escape para o caso legítimo: reverter uma migração ao
          # conteúdo original é justamente como se conserta um checksum já
          # quebrado. Sem isto, a regra impediria o próprio conserto.
          if git log -1 --pretty=%B | grep -qiE '\[migracao-revertida\]'; then
            echo "AVISO: migração alterada, liberada por [migracao-revertida] na mensagem do commit:"
            echo "$alteradas" | sed 's/^/  - /'
            echo "Confirme que o conteúdo voltou ao que está aplicado em produção."
            exit 0
          fi

          echo "ERRO: migração já versionada foi alterada ou removida:"
          echo "$alteradas" | sed 's/^/  - /'
          echo
          echo "O Flyway valida o checksum de cada migração aplicada e se recusa"
          echo "a iniciar quando ele muda. Para corrigir o efeito de uma migração"
          echo "já aplicada, crie uma nova versão em vez de editar a antiga."
          echo
          echo "Se esta mudança RESTAURA uma migração ao conteúdo já aplicado,"
          echo "inclua [migracao-revertida] na mensagem do commit."
          exit 1

  build-backend:
    needs: validate-migrations
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.name }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - id: image
        name: Define immutable GHCR repository
        run: echo "name=ghcr.io/$(printf '%s' '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/mercadoflow-backend" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ steps.image.outputs.name }}:sha-${{ github.sha }}

  build-frontend:
    needs: validate-migrations
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.name }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - id: image
        name: Define immutable GHCR repository
        run: echo "name=ghcr.io/$(printf '%s' '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/mercadoflow-frontend" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          build-args: |
            VITE_API_URL=https://mercadoflow.com/api
            VITE_SHOW_TEST_LOGINS=false
          tags: ${{ steps.image.outputs.name }}:sha-${{ github.sha }}

  build-collectors:
    needs: validate-migrations
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.name }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - id: image
        name: Define immutable GHCR repository
        run: echo "name=ghcr.io/$(printf '%s' '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/mercadoflow-collectors" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: ./deploy/collectors
          push: true
          tags: ${{ steps.image.outputs.name }}:sha-${{ github.sha }}

  deploy:
    needs: [build-backend, build-frontend, build-collectors]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      VPS_HOST: srv953800.hstgr.cloud
      VPS_APP_DIR: /root/mercadoflow-web
      MERCADOFLOW_BACKEND_IMAGE: ${{ needs.build-backend.outputs.image }}@${{ needs.build-backend.outputs.digest }}
      MERCADOFLOW_FRONTEND_IMAGE: ${{ needs.build-frontend.outputs.image }}@${{ needs.build-frontend.outputs.digest }}
      MERCADOFLOW_COLLECTORS_IMAGE: ${{ needs.build-collectors.outputs.image }}@${{ needs.build-collectors.outputs.digest }}

    steps:
      - name: Checkout deployment files
        uses: actions/checkout@v4

      - name: Install SSH tools
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass rsync

      - name: Install pinned VPS host key
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          install -m 600 .github/vps_known_hosts ~/.ssh/known_hosts
          ssh-keygen -lf ~/.ssh/known_hosts -E sha256 | awk '$2 == "SHA256:qEkOWNaWFZykVFmF/pMUlWvXYssbO0byQTW4KfcnHPU" { found=1 } END { exit !found }'

      - name: Prepare SSH password file
        run: |
          mkdir -p ~/.ssh
          printf '%s' "${{ secrets.VPS_PASSWORD }}" > ~/.ssh/vps_password
          chmod 600 ~/.ssh/vps_password

      # Primeiro contato com a VPS.
      #
      # A porta 22 e alcancavel da internet (sshd escutando, sem ufw, sem
      # fail2ban, nenhuma regra bloqueando a 22), mas alguns runners nao
      # chegam la: a Hostinger filtra por reputacao faixas de datacenter, e o
      # GitHub sorteia o runner entre ~7300 faixas, quase todas Azure. Em
      # 10/08, tres deploys passaram e tres falharam — depende do IP sorteado.
      #
      # Por isso NAO ha laco de retry aqui. Insistir do mesmo runner repete o
      # mesmo IP ja rejeitado: a versao anterior gastou 10 minutos em 9
      # tentativas sem nenhuma chance a mais de sucesso. Uma tentativa curta,
      # e o job inteiro e refeito (num runner novo, com IP novo) pelo passo de
      # retry abaixo.
      - name: Ensure application directory exists on VPS
        id: contato
        timeout-minutes: 3
        run: |
          set -euo pipefail
          if ! sshpass -f ~/.ssh/vps_password ssh \
                 -o StrictHostKeyChecking=yes \
                 -o "UserKnownHostsFile=$HOME/.ssh/known_hosts" \
                 -o ConnectTimeout=30 \
                 root@${VPS_HOST} "mkdir -p ${VPS_APP_DIR}"; then
            echo
            echo "Este runner nao alcanca a porta 22 da VPS."
            echo "IP de saida deste runner: $(curl -s --max-time 10 ifconfig.me || echo 'indisponivel')"
            echo
            echo "A aplicacao provavelmente esta no ar — confira:"
            echo "  https://mercadoflow.com/api/v1/health"
            echo
            echo "Solucao: 'Re-run all jobs'. O novo runner recebe outro IP e"
            echo "costuma passar. Se falhar varias vezes seguidas, peca a"
            echo "Hostinger para liberar as faixas do GitHub Actions na porta 22."
            exit 1
          fi

      - name: Sync code to VPS
        run: |
          sshpass -f ~/.ssh/vps_password rsync -az --delete \
            --exclude='.git' \
            --exclude='backend' \
            --exclude='backend/**' \
            --exclude='frontend' \
            --exclude='frontend/**' \
            --exclude='node_modules' \
            --exclude='dist' \
            --exclude='build' \
            --exclude='.next' \
            --exclude='*.db' \
            --exclude='*.db-*' \
            --exclude='backend/data' \
            --exclude='backend/logs' \
            --exclude='backend/uploads' \
            --exclude='.env' \
            --exclude='.env.local' \
            --exclude='.env.previous' \
            --exclude='.db_secret' \
            --exclude='.jwt_secret' \
            --exclude='.app_role_secret' \
            --exclude='.env.bak-*' \
            --exclude='data/catalog' \
            --exclude='data/catalog/**' \
            --exclude='data/offers' \
            --exclude='data/offers/**' \
            --exclude='backups' \
            --exclude='pdv2cloud-agent/installer/Output' \
            --exclude='pdv2cloud-agent/installer/Output/**' \
            --exclude='tools' \
            -e "ssh -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts" \
            ./ root@${VPS_HOST}:${VPS_APP_DIR}/

      - name: Run deployment on VPS
        run: |
          # Sem aspas no delimitador: as variaveis do Stripe precisam ser
          # expandidas AQUI, no runner, para chegarem ao script na VPS. Os
          # valores nao aparecem no log porque o GitHub mascara secrets.
          #
          # Secrets ausentes viram string vazia, e o deploy-web.sh reaproveita o
          # que ja estiver no .env do servidor — um deploy sem eles nao desliga
          # a cobranca que ja funcionava.
          # ServerAlive*: o pg_dump pre-migracao fica ~11 min sem escrever nada
          # no terminal. Sem keepalive a conexao ociosa era derrubada no meio do
          # backup ("client_loop: send disconnect: Broken pipe", exit 255) e o
          # Actions falhava enquanto o script seguia rodando orfao na VPS.
          sshpass -f ~/.ssh/vps_password ssh \
            -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=$HOME/.ssh/known_hosts" \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=120 \
            root@${VPS_HOST} <<EOF
          set -euo pipefail
          cd /root/mercadoflow-web
          chmod +x deploy/deploy-web.sh
          GHCR_USERNAME='${{ github.repository_owner }}'
          GHCR_PULL_TOKEN='${{ secrets.GHCR_PULL_TOKEN }}'
          if [ -z "\$GHCR_PULL_TOKEN" ]; then
            echo "GHCR_PULL_TOKEN ausente: configure um token com packages:read para a VPS" >&2
            exit 1
          fi
          printf '%s' "\$GHCR_PULL_TOKEN" | docker login ghcr.io --username "\$GHCR_USERNAME" --password-stdin
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
          # Preserva imagens de rollback e cache compartilhado ate medir
          # ownership/retencao; nao execute prune de artefatos Docker no deploy.
          APP_DIR=/root/mercadoflow-web \
          COMPOSE_PROJECT_NAME=mercadoflow-web \
          MERCADOFLOW_BACKEND_IMAGE='${{ env.MERCADOFLOW_BACKEND_IMAGE }}' \
          MERCADOFLOW_FRONTEND_IMAGE='${{ env.MERCADOFLOW_FRONTEND_IMAGE }}' \
          MERCADOFLOW_COLLECTORS_IMAGE='${{ env.MERCADOFLOW_COLLECTORS_IMAGE }}' \
          DOCKER_CLEANUP_ENABLED=false \
          DOCKER_CLEANUP_PROJECT_CONTAINERS=false \
          DOCKER_CLEANUP_DANGLING_IMAGES=false \
          DOCKER_CLEANUP_BUILD_CACHE=false \
          STRIPE_ENABLED='${{ secrets.STRIPE_ENABLED }}' \
          STRIPE_SECRET_KEY='${{ secrets.STRIPE_SECRET_KEY }}' \
          STRIPE_WEBHOOK_SECRET='${{ secrets.STRIPE_WEBHOOK_SECRET }}' \
          STRIPE_PRICE_ESSENCIAL='${{ secrets.STRIPE_PRICE_ESSENCIAL }}' \
          STRIPE_PRICE_PROFISSIONAL='${{ secrets.STRIPE_PRICE_PROFISSIONAL }}' \
          ./deploy/deploy-web.sh
          EOF

      - name: Verify deployment
        run: |
          echo "Deploy concluído com sucesso"
          echo "Aplicação: https://mercadoflow.com"
          echo "Health: https://mercadoflow.com/health"
