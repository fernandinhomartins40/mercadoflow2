name: Deploy PDV2Cloud Web to VPS

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'scripts/**'
      - 'docker-compose.vps.yml'
      - 'deploy/**'
      - '.github/workflows/deploy-pdv2cloud-web.yml'
  workflow_dispatch:

concurrency:
  group: deploy-pdv2cloud-web
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VPS_HOST: 72.60.10.112
      VPS_APP_DIR: /root/mercadoflow-web

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install SSH tools
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass rsync

      - name: Prepare SSH password file
        run: |
          mkdir -p ~/.ssh
          printf '%s' "${{ secrets.VPS_PASSWORD }}" > ~/.ssh/vps_password
          chmod 600 ~/.ssh/vps_password

      - name: Ensure application directory exists on VPS
        run: |
          sshpass -f ~/.ssh/vps_password ssh -o StrictHostKeyChecking=no root@${VPS_HOST} \
            "mkdir -p ${VPS_APP_DIR}"

      - name: Sync code to VPS
        run: |
          sshpass -f ~/.ssh/vps_password rsync -az --delete \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='dist' \
            --exclude='build' \
            --exclude='.next' \
            --exclude='*.db' \
            --exclude='*.db-*' \
            --exclude='backend/data' \
            --exclude='backend/logs' \
            --exclude='backend/uploads' \
            --exclude='.env' \
            --exclude='.env.local' \
            --exclude='.db_secret' \
            --exclude='.jwt_secret' \
            --exclude='data/catalog' \
            --exclude='data/catalog/**' \
            --exclude='backups' \
            --exclude='pdv2cloud-agent/installer/Output' \
            --exclude='pdv2cloud-agent/installer/Output/**' \
            --exclude='tools' \
            -e "ssh -o StrictHostKeyChecking=no" \
            ./ root@${VPS_HOST}:${VPS_APP_DIR}/

      - name: Run deployment on VPS
        run: |
          sshpass -f ~/.ssh/vps_password ssh -o StrictHostKeyChecking=no root@${VPS_HOST} <<'EOF'
          set -euo pipefail
          cd /root/mercadoflow-web
          chmod +x deploy/deploy-web.sh
          APP_DIR=/root/mercadoflow-web \
          COMPOSE_PROJECT_NAME=mercadoflow-web \
          ./deploy/deploy-web.sh
          EOF

      - name: Verify deployment
        run: |
          echo "Deploy concluído com sucesso"
          echo "Aplicação: https://mercadoflow.com"
          echo "Health: https://mercadoflow.com/health"
