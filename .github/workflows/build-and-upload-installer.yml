name: Build and Upload PDV2Cloud Installer

on:
  push:
    branches: [main]
    paths:
      - 'pdv2cloud-agent/**'
      - 'pdv2cloud-config/**'
      - '.github/workflows/build-and-upload-installer.yml'
  workflow_dispatch:

concurrency:
  group: build-upload-installer
  cancel-in-progress: true

jobs:
  # ── Build: uma job por arquitetura ────────────────────────────────────────
  build:
    runs-on: windows-latest
    timeout-minutes: 60

    strategy:
      fail-fast: false          # continua o outro arch se um falhar
      matrix:
        arch: [x64, x86]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: pdv2cloud-config/package-lock.json

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Build Electron Config UI
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location pdv2cloud-config
          npm ci
          npm run build
          npm run package
          # electron-builder gera dist/win-unpacked por padrão
          if (-not (Test-Path "dist")) {
            Write-Host "ERRO: pdv2cloud-config/dist não encontrado após build" -ForegroundColor Red
            exit 1
          }
          Write-Host "Config UI buildada em $(Resolve-Path dist)" -ForegroundColor Green

      - name: Build Installer (${{ matrix.arch }})
        shell: pwsh
        env:
          PDV2CLOUD_CODESIGN_PFX_BASE64:   ${{ secrets.PDV2CLOUD_CODESIGN_PFX_BASE64 }}
          PDV2CLOUD_CODESIGN_PFX_PASSWORD: ${{ secrets.PDV2CLOUD_CODESIGN_PFX_PASSWORD }}
          PDV2CLOUD_CODESIGN_TIMESTAMP_URL: ${{ secrets.PDV2CLOUD_CODESIGN_TIMESTAMP_URL }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = "1.0.$env:GITHUB_RUN_NUMBER"
          Write-Host "Arch: ${{ matrix.arch }} | Version: $version"

          $sign = $false
          if ($env:PDV2CLOUD_CODESIGN_PFX_BASE64 -and $env:PDV2CLOUD_CODESIGN_PFX_BASE64.Trim().Length -gt 0) {
            $pfxPath = Join-Path $env:RUNNER_TEMP "pdv2cloud-codesign.pfx"
            [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:PDV2CLOUD_CODESIGN_PFX_BASE64))
            $env:PDV2CLOUD_CODESIGN_PFX = $pfxPath
            $sign = $true
          }

          $params = @(
            "-Version", $version,
            "-Arch", "${{ matrix.arch }}",
            "-PrepareArtifacts"
          )
          if ($sign) { $params += "-Sign" }

          pwsh -ExecutionPolicy Bypass -File "pdv2cloud-agent/scripts/build-installer.ps1" @params

      # Sufixo vazio para x64, "-x86" para x86
      - name: Upload Artifact (${{ matrix.arch }})
        uses: actions/upload-artifact@v4
        with:
          name: pdv2cloud-installer-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            pdv2cloud-agent/installer/Output/PDV2Cloud-Setup${{ matrix.arch == 'x86' && '-x86' || '' }}.exe
            pdv2cloud-agent/installer/Output/PDV2Cloud-Setup${{ matrix.arch == 'x86' && '-x86' || '' }}.exe.sha256
            pdv2cloud-agent/installer/Output/PDV2Cloud-Setup${{ matrix.arch == 'x86' && '-x86' || '' }}.exe.meta.json

  # ── Upload: aguarda os dois builds e envia ao VPS ─────────────────────────
  upload_vps:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 20

    steps:
      - name: Download x64 Artifact
        uses: actions/download-artifact@v4
        with:
          name: pdv2cloud-installer-x64
          path: installer

      - name: Download x86 Artifact
        uses: actions/download-artifact@v4
        with:
          name: pdv2cloud-installer-x86
          path: installer

      - name: Upload To VPS (Atomic)
        env:
          VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass

          VPS_HOST="72.60.10.112"
          VPS_USER="root"
          TARGET_DIR="/root/mercadoflow-web/pdv2cloud-agent/installer/Output"

          echo "Criando diretório no VPS..."
          sshpass -p "$VPS_PASSWORD" ssh -o StrictHostKeyChecking=no "$VPS_USER@$VPS_HOST" \
            "mkdir -p '$TARGET_DIR'"

          # Envia todos os artefatos (x64 e x86) atomicamente
          for f in \
            PDV2Cloud-Setup.exe \
            PDV2Cloud-Setup.exe.sha256 \
            PDV2Cloud-Setup.exe.meta.json \
            PDV2Cloud-Setup-x86.exe \
            PDV2Cloud-Setup-x86.exe.sha256 \
            PDV2Cloud-Setup-x86.exe.meta.json; do

            if [ ! -f "installer/$f" ]; then
              echo "AVISO: arquivo não encontrado: installer/$f (ignorando)"
              continue
            fi

            echo "Enviando $f..."
            sshpass -p "$VPS_PASSWORD" scp -o StrictHostKeyChecking=no \
              "installer/$f" "$VPS_USER@$VPS_HOST:$TARGET_DIR/$f.new"

            sshpass -p "$VPS_PASSWORD" ssh -o StrictHostKeyChecking=no "$VPS_USER@$VPS_HOST" \
              "mv -f '$TARGET_DIR/$f.new' '$TARGET_DIR/$f' && echo 'Movido: $f'"
          done

          echo "Verificando arquivos no VPS..."
          sshpass -p "$VPS_PASSWORD" ssh -o StrictHostKeyChecking=no "$VPS_USER@$VPS_HOST" \
            "ls -lh '$TARGET_DIR'"

          echo "Reiniciando backend para recarregar instaladores..."
          sshpass -p "$VPS_PASSWORD" ssh -o StrictHostKeyChecking=no "$VPS_USER@$VPS_HOST" \
            "cd /root/mercadoflow-web && docker compose -f docker-compose.vps.yml restart mercadoflow-backend"

          sleep 10

          echo "Verificando acesso via API (x64)..."
          sshpass -p "$VPS_PASSWORD" ssh -o StrictHostKeyChecking=no "$VPS_USER@$VPS_HOST" \
            "curl -sf http://localhost:3300/api/v1/downloads/agent-installer/version | python3 -m json.tool || echo 'Aviso: falha na verificação'"

          echo "Verificando acesso via API (x86)..."
          sshpass -p "$VPS_PASSWORD" ssh -o StrictHostKeyChecking=no "$VPS_USER@$VPS_HOST" \
            "curl -sf http://localhost:3300/api/v1/downloads/agent-installer/version?arch=x86 | python3 -m json.tool || echo 'Aviso: falha na verificação x86'"
