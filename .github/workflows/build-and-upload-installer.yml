name: Build and Upload PDV2Cloud Installer

on:
  push:
    branches: [main]
    paths:
      - 'pdv2cloud-agent/**'
      - 'pdv2cloud-config/**'
      - '.github/workflows/build-and-upload-installer.yml'
  # Batimento semanal. O agente muda com pouca frequência, e o GitHub desabilita
  # workflows sem execução por 60 dias — foi o que aconteceu entre maio e agosto
  # de 2026: o rename do produto foi commitado, o gatilho de paths casou, mas o
  # workflow já estava desabilitado e nada rodou. Rodar toda semana mantém o
  # workflow vivo e ainda revela quebras de build antes de alguém precisar do
  # instalador.
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

concurrency:
  group: build-upload-installer
  cancel-in-progress: true

jobs:
  # ── Build: uma job por arquitetura ────────────────────────────────────────
  build:
    runs-on: windows-latest
    timeout-minutes: 60

    strategy:
      fail-fast: false          # continua o outro arch se um falhar
      matrix:
        arch: [x64, x86]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: pdv2cloud-config/package-lock.json

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Build Electron Config UI
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location pdv2cloud-config
          npm ci
          npm run build
          npm run package
          # electron-builder gera dist/win-unpacked por padrão
          if (-not (Test-Path "dist")) {
            Write-Host "ERRO: pdv2cloud-config/dist não encontrado após build" -ForegroundColor Red
            exit 1
          }
          Write-Host "Config UI buildada em $(Resolve-Path dist)" -ForegroundColor Green

      - name: Build Installer (${{ matrix.arch }})
        shell: pwsh
        env:
          PDV2CLOUD_CODESIGN_PFX_BASE64:   ${{ secrets.PDV2CLOUD_CODESIGN_PFX_BASE64 }}
          PDV2CLOUD_CODESIGN_PFX_PASSWORD: ${{ secrets.PDV2CLOUD_CODESIGN_PFX_PASSWORD }}
          PDV2CLOUD_CODESIGN_TIMESTAMP_URL: ${{ secrets.PDV2CLOUD_CODESIGN_TIMESTAMP_URL }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = "1.0.$env:GITHUB_RUN_NUMBER"
          Write-Host "Arch: ${{ matrix.arch }} | Version: $version"

          $sign = $false
          if ($env:PDV2CLOUD_CODESIGN_PFX_BASE64 -and $env:PDV2CLOUD_CODESIGN_PFX_BASE64.Trim().Length -gt 0) {
            $pfxPath = Join-Path $env:RUNNER_TEMP "pdv2cloud-codesign.pfx"
            [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:PDV2CLOUD_CODESIGN_PFX_BASE64))
            $env:PDV2CLOUD_CODESIGN_PFX = $pfxPath
            $sign = $true
          }

          $params = @(
            "-Version", $version,
            "-Arch", "${{ matrix.arch }}",
            "-PrepareArtifacts"
          )
          if ($sign) { $params += "-Sign" }

          pwsh -ExecutionPolicy Bypass -File "pdv2cloud-agent/scripts/build-installer.ps1" @params

      # O artefato é o transporte entre o runner Windows (que compila) e o
      # Ubuntu (que envia à VPS).
      #
      # Enviar direto daqui parecia melhor — corta o intermediário e não gasta
      # cota — mas o runner Windows não alcança a porta 22 da VPS: dá
      # "Network error: Connection timed out". Quem sempre falou com o servidor
      # foi o job Ubuntu, e é a rota que comprovadamente funciona.
      #
      # O que causou o estouro de cota não foi existir artefato, e sim retê-lo
      # por 90 dias (o padrão) sendo que ele vive uns poucos minutos entre os
      # dois jobs. Com 1 dia, o custo de storage é desprezível.
      - name: Upload Artifact (${{ matrix.arch }})
        uses: actions/upload-artifact@v4
        with:
          name: pdv2cloud-installer-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 1
          compression-level: 0   # .exe já vem comprimido; recomprimir só custa tempo
          path: |
            pdv2cloud-agent/installer/Output/AgenteMercadoFlow-Setup${{ matrix.arch == 'x86' && '-x86' || '' }}.exe
            pdv2cloud-agent/installer/Output/AgenteMercadoFlow-Setup${{ matrix.arch == 'x86' && '-x86' || '' }}.exe.sha256
            pdv2cloud-agent/installer/Output/AgenteMercadoFlow-Setup${{ matrix.arch == 'x86' && '-x86' || '' }}.exe.meta.json

  # ── Publica: baixa os dois arquivos, envia à VPS, recarrega e confere ─────
  publicar:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 20

    steps:
      - name: Baixar instalador x64
        uses: actions/download-artifact@v4
        with:
          name: pdv2cloud-installer-x64
          path: installer

      - name: Baixar instalador x86
        uses: actions/download-artifact@v4
        with:
          name: pdv2cloud-installer-x86
          path: installer

      - name: Enviar para a VPS e verificar publicação
        env:
          VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass

          VPS_HOST="72.60.10.112"
          VPS_USER="root"
          TARGET_DIR="/root/mercadoflow-web/pdv2cloud-agent/installer/Output"

          ssh_run() {
            sshpass -p "$VPS_PASSWORD" ssh -o StrictHostKeyChecking=no \
              "$VPS_USER@$VPS_HOST" "$1"
          }

          ssh_run "mkdir -p '$TARGET_DIR'"

          for f in \
            AgenteMercadoFlow-Setup.exe \
            AgenteMercadoFlow-Setup.exe.sha256 \
            AgenteMercadoFlow-Setup.exe.meta.json \
            AgenteMercadoFlow-Setup-x86.exe \
            AgenteMercadoFlow-Setup-x86.exe.sha256 \
            AgenteMercadoFlow-Setup-x86.exe.meta.json; do

            # Falta de arquivo aqui é erro: antes isso era só um aviso e o job
            # seguia verde publicando pela metade.
            if [ ! -f "installer/$f" ]; then
              echo "ERRO: artefato nao trouxe $f"
              exit 1
            fi

            echo "Enviando $f..."
            sshpass -p "$VPS_PASSWORD" scp -o StrictHostKeyChecking=no \
              "installer/$f" "$VPS_USER@$VPS_HOST:$TARGET_DIR/$f.new"

            # Publica com mv: o download nunca enxerga um arquivo pela metade.
            ssh_run "mv -f '$TARGET_DIR/$f.new' '$TARGET_DIR/$f'"
          done

          echo "Arquivos publicados:"
          ssh_run "ls -lh '$TARGET_DIR'"

          echo "Reiniciando backend para recarregar instaladores..."
          ssh_run "cd /root/mercadoflow-web && docker compose -f docker-compose.vps.yml restart mercadoflow-backend"

          # Espera o backend responder em vez de dormir um tempo fixo. O
          # "sleep 10" anterior perdia a corrida com a subida do Spring: o
          # curl pegava a aplicação ainda inicializando, e o -f derrubava o
          # job com exit 22 depois de uma publicação que dera certo.
          echo "Aguardando o backend ficar pronto..."
          pronto=0
          for _ in $(seq 1 30); do
            if ssh_run "curl -sf -o /dev/null 'http://localhost:3300/api/v1/downloads/agent-installer/version'"; then
              pronto=1
              break
            fi
            sleep 5
          done
          if [ "$pronto" -ne 1 ]; then
            echo "ERRO: backend nao respondeu em 150s apos o restart."
            exit 1
          fi

          # Falha o job se a API ainda servir o binário legado: sem isso, uma
          # publicação que não chegou ao destino passaria como sucesso — foi
          # assim que o instalador ficou três meses desatualizado sem aviso.
          for arch in x64 x86; do
            echo "Verificando $arch..."
            body=$(ssh_run "curl -sf 'http://localhost:3300/api/v1/downloads/agent-installer/version?arch=$arch'")
            echo "  $body"

            case "$body" in
              *'"status":"legacy"'*|*'"status": "legacy"'*)
                echo "ERRO: API ainda serve o instalador legado em $arch."
                exit 1
                ;;
              *'"status":"available"'*|*'"status": "available"'*)
                ;;
              *)
                echo "ERRO: resposta inesperada da API para $arch."
                exit 1
                ;;
            esac
          done

          echo "Instalador publicado e verificado nas duas arquiteturas."
